name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install libusb headers
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
